# FlexiO Energy
#
# Generated by scripts/make_dashboard.py -- edit that, not this file.
#
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch,
# then open it, three-dot menu -> Edit -> three-dot menu -> Raw configuration
# editor, and replace everything there with this file.
#
# Every card here ships with Home Assistant; nothing extra to install.
# Needs Home Assistant 2025.10 or newer for the sparklines inside the tiles.
# On anything older those tiles show an unknown-feature error and the rest of
# the dashboard still works; delete the two "features" lines to silence them.
# Entity IDs are the ones a fresh install creates. If yours differ -- a second
# FlexiObox, or an install predating the inverter rename -- adjust them here.

views:
  - type: sections
    title: Now
    path: now
    icon: mdi:flash
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Live power
            heading_style: title
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.flexio_solar_production
            name: Solar
            color: amber
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_household_consumption
            name: House
            color: blue
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_grid_power
            name: Grid
            color: red
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_power
            name: Battery
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.flexio_battery_state_of_charge
            name: Charge
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: var(--error-color)
              - from: 20
                color: var(--warning-color)
              - from: 50
                color: var(--success-color)
            grid_options:
              columns: 12
              rows: 4
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: So far today
            heading_style: title
            icon: mdi:calendar-today
          - type: statistic
            entity: sensor.flexio_solar_production_energy
            name: Produced
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_household_consumption_energy
            name: Consumed
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_grid_import_energy
            name: Imported
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_grid_export_energy
            name: Exported
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_charge_energy
            name: Charged
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_discharge_energy
            name: Discharged
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: The last three hours
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - sensor.flexio_solar_production
              - sensor.flexio_household_consumption
              - sensor.flexio_grid_power
              - sensor.flexio_battery_power
            hours_to_show: 3
            title: Power
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - sensor.flexio_battery_state_of_charge
            hours_to_show: 3
            title: Battery charge
            grid_options:
              columns: full
  - type: sections
    title: Energy
    path: energy
    icon: mdi:lightning-bolt
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Energy dashboard
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: energy-date-selection
          - type: energy-distribution
            link_dashboard: true
          - type: energy-usage-graph
          - type: energy-solar-graph
          - type: energy-sources-table
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Day by day
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            entities:
              - sensor.flexio_solar_production_energy
              - sensor.flexio_household_consumption_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            entities:
              - sensor.flexio_grid_import_energy
              - sensor.flexio_grid_export_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            entities:
              - sensor.flexio_battery_charge_energy
              - sensor.flexio_battery_discharge_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: markdown
            content: |-
              ### Set this up once

              These cards read Home Assistant's own energy configuration, so they stay empty until you fill it in under **Settings → Dashboards → Energy**:

              | Slot | Entity |
              | --- | --- |
              | Grid consumption | `sensor.flexio_grid_import_energy` |
              | Return to grid | `sensor.flexio_grid_export_energy` |
              | Solar production | `sensor.flexio_solar_production_energy` |
              | Battery: energy in | `sensor.flexio_battery_charge_energy` |
              | Battery: energy out | `sensor.flexio_battery_discharge_energy` |

              The totals start at zero the day you install the integration — the box reports live values only, so there is no history to backfill. Statistics are compiled hourly, so give it until the next full hour before deciding something is broken.
            grid_options:
              columns: full
  - type: sections
    title: Battery
    path: battery
    icon: mdi:battery-high
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: State of the battery
            heading_style: title
            icon: mdi:battery-heart-variant
          - type: gauge
            entity: sensor.flexio_battery_state_of_charge
            name: Charge
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: var(--error-color)
              - from: 20
                color: var(--warning-color)
              - from: 50
                color: var(--success-color)
            grid_options:
              columns: 12
              rows: 4
          - type: tile
            entity: sensor.flexio_battery_state_of_health
            name: Health
            color: green
            vertical: false
            grid_options:
              columns: 12
              rows: 1
          - type: tile
            entity: sensor.flexio_battery_voltage
            name: Voltage
            color: cyan
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_current
            name: Current
            color: cyan
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_power
            name: Battery
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Charging and discharging
            heading_style: title
            icon: mdi:battery-charging
          - type: statistic
            entity: sensor.flexio_battery_charge_energy
            name: Charged
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_discharge_energy
            name: Discharged
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: history-graph
            entities:
              - sensor.flexio_battery_power
            hours_to_show: 12
            title: Power
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Day by day
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            entities:
              - sensor.flexio_battery_charge_energy
              - sensor.flexio_battery_discharge_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - sensor.flexio_battery_state_of_charge
            hours_to_show: 24
            title: Battery charge
            grid_options:
              columns: full
  - type: sections
    title: System
    path: system
    icon: mdi:cog
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Inverter and grid
            heading_style: title
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.flexio_inverter_power_total_ac
            name: Inverter, total AC
            color: deep-orange
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_power
            name: Battery
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_grid_power
            name: Grid
            color: red
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_inverter_setpoint
            name: Inverter setpoint
            color: grey
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_setpoint
                state_not:
                  - unavailable
                  - unknown
          - type: history-graph
            entities:
              - sensor.flexio_inverter_power_total_ac
              - sensor.flexio_solar_production
              - sensor.flexio_battery_power
            hours_to_show: 6
            title: Power
            grid_options:
              columns: full
          - type: markdown
            content: |-
              ### Why there are two of these

              **Inverter, total AC** is everything the inverter is moving, with the solar production already inside it. **Battery** is the battery's own flow, `inverter − solar`, which is the number the FlexiO app shows and the one the energy totals are built from.

              On a sunny afternoon the inverter reads strongly positive while the battery sits at nearly zero. Reading the inverter as the battery is what makes a battery appear to deliver several times more energy than it ever absorbed.
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Price and the generic load
            heading_style: title
            icon: mdi:currency-eur
          - type: tile
            entity: sensor.flexio_electricity_price
            name: Electricity price
            color: green
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.flexio_electricity_price
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_generic_load_available_power
            name: Generic load available
            color: teal
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: sensor.flexio_generic_load_available_power
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: number.flexio_generic_load_maximum_price
            name: Generic load price cap
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: number.flexio_generic_load_maximum_price
                state_not:
                  - unavailable
                  - unknown
          - type: history-graph
            entities:
              - sensor.flexio_electricity_price
            hours_to_show: 24
            title: Electricity price
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.flexio_electricity_price
                state_not:
                  - unavailable
                  - unknown
          - type: heading
            heading: Diagnostics
            heading_style: title
            icon: mdi:information-outline
          - type: tile
            entity: sensor.flexio_converter
            name: Converter
            color: grey
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.flexio_converter
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_last_measurement
            name: Last measurement
            color: grey
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.flexio_last_measurement
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            content: Cards for a measurement your firmware does not report show as unavailable. The inverter setpoint, the generic load and the electricity price are the usual ones; the last measurement is disabled by default and can be enabled on the device page.
            grid_options:
              columns: full
