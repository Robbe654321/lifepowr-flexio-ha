# FlexiO Energie
#
# Generated by scripts/make_dashboard.py -- edit that, not this file.
#
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch,
# then open it, three-dot menu -> Edit -> three-dot menu -> Raw configuration
# editor, and replace everything there with this file.
#
# Every card here ships with Home Assistant; nothing extra to install.
# Needs Home Assistant 2025.10 or newer for the sparklines inside the tiles.
# On anything older those tiles show an unknown-feature error and the rest of
# the dashboard still works; delete the two "features" lines to silence them.
# Entity IDs are the ones a fresh install creates. Both spellings of the
# inverter sensor are handled, so an install predating the 0.2.0 rename works
# too. If yours differ for another reason -- a second FlexiObox, say -- adjust
# them here.

views:
  - type: sections
    title: Nu
    path: now
    icon: mdi:flash
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Vermogen nu
            heading_style: title
            icon: mdi:transmission-tower
          - type: tile
            entity: sensor.flexio_solar_production
            name: Zon
            color: amber
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_household_consumption
            name: Huis
            color: blue
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_grid_power
            name: Net
            color: red
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_power
            name: Batterij
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: gauge
            entity: sensor.flexio_battery_state_of_charge
            name: Lading
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: var(--error-color)
              - from: 20
                color: var(--warning-color)
              - from: 50
                color: var(--success-color)
            grid_options:
              columns: 12
              rows: 4
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Vandaag tot nu toe
            heading_style: title
            icon: mdi:calendar-today
          - type: statistic
            entity: sensor.flexio_solar_production_energy
            name: Geproduceerd
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_household_consumption_energy
            name: Verbruikt
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_grid_import_energy
            name: Afgenomen
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_grid_export_energy
            name: Teruggeleverd
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_charge_energy
            name: Geladen
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_discharge_energy
            name: Ontladen
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: De afgelopen drie uur
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            entities:
              - sensor.flexio_solar_production
              - sensor.flexio_household_consumption
              - sensor.flexio_grid_power
              - sensor.flexio_battery_power
            hours_to_show: 3
            title: Vermogen
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - sensor.flexio_battery_state_of_charge
            hours_to_show: 3
            title: Lading batterij
            grid_options:
              columns: full
  - type: sections
    title: Energie
    path: energy
    icon: mdi:lightning-bolt
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Energiedashboard
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: energy-date-selection
          - type: energy-distribution
            link_dashboard: true
          - type: energy-usage-graph
          - type: energy-solar-graph
          - type: energy-sources-table
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Dag per dag
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            entities:
              - sensor.flexio_solar_production_energy
              - sensor.flexio_household_consumption_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            entities:
              - sensor.flexio_grid_import_energy
              - sensor.flexio_grid_export_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            entities:
              - sensor.flexio_battery_charge_energy
              - sensor.flexio_battery_discharge_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: markdown
            content: |-
              ### Dit stel je één keer in

              Deze kaarten lezen de energie-instellingen van Home Assistant zelf, dus ze blijven leeg tot je die invult onder **Instellingen → Dashboards → Energie**:

              | Veld | Entiteit |
              | --- | --- |
              | Netafname | `sensor.flexio_grid_import_energy` |
              | Teruglevering | `sensor.flexio_grid_export_energy` |
              | Zonneproductie | `sensor.flexio_solar_production_energy` |
              | Batterij: energie in | `sensor.flexio_battery_charge_energy` |
              | Batterij: energie uit | `sensor.flexio_battery_discharge_energy` |

              De tellers beginnen op nul op de dag dat je de integratie installeert — de box geeft alleen live waarden, er valt geen geschiedenis in te halen. Statistieken worden per uur samengesteld, dus wacht tot het volgende hele uur voor je concludeert dat er iets stuk is.
            grid_options:
              columns: full
  - type: sections
    title: Batterij
    path: battery
    icon: mdi:battery-high
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Toestand van de batterij
            heading_style: title
            icon: mdi:battery-heart-variant
          - type: gauge
            entity: sensor.flexio_battery_state_of_charge
            name: Lading
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: var(--error-color)
              - from: 20
                color: var(--warning-color)
              - from: 50
                color: var(--success-color)
            grid_options:
              columns: 12
              rows: 4
          - type: tile
            entity: sensor.flexio_battery_state_of_health
            name: Gezondheid
            color: green
            vertical: false
            grid_options:
              columns: 12
              rows: 1
          - type: tile
            entity: sensor.flexio_battery_voltage
            name: Spanning
            color: cyan
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_current
            name: Stroom
            color: cyan
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_battery_power
            name: Batterij
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Laden en ontladen
            heading_style: title
            icon: mdi:battery-charging
          - type: statistic
            entity: sensor.flexio_battery_charge_energy
            name: Geladen
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: sensor.flexio_battery_discharge_energy
            name: Ontladen
            stat_type: change
            period:
              calendar:
                period: day
            grid_options:
              columns: 6
              rows: 2
          - type: history-graph
            entities:
              - sensor.flexio_battery_power
            hours_to_show: 12
            title: Vermogen
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Dag per dag
            heading_style: title
            icon: mdi:chart-bar
          - type: statistics-graph
            entities:
              - sensor.flexio_battery_charge_energy
              - sensor.flexio_battery_discharge_energy
            days_to_show: 30
            period: day
            stat_types:
              - change
            chart_type: bar
            grid_options:
              columns: full
          - type: history-graph
            entities:
              - sensor.flexio_battery_state_of_charge
            hours_to_show: 24
            title: Lading batterij
            grid_options:
              columns: full
  - type: sections
    title: Systeem
    path: system
    icon: mdi:cog
    max_columns: 2
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Omvormer en net
            heading_style: title
            icon: mdi:solar-power-variant
          - type: tile
            entity: sensor.flexio_inverter_power_total_ac
            name: Omvormer, totaal AC
            color: deep-orange
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_power_total_ac
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_inverter_power
            name: Omvormer, totaal AC
            color: deep-orange
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_power
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_battery_power
            name: Batterij
            color: purple
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_grid_power
            name: Net
            color: red
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.flexio_inverter_setpoint
            name: Setpoint omvormer
            color: grey
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_setpoint
                state_not:
                  - unavailable
                  - unknown
          - type: history-graph
            entities:
              - sensor.flexio_inverter_power_total_ac
              - sensor.flexio_solar_production
              - sensor.flexio_battery_power
            hours_to_show: 6
            title: Vermogen
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_power_total_ac
                state_not:
                  - unavailable
                  - unknown
          - type: history-graph
            entities:
              - sensor.flexio_inverter_power
              - sensor.flexio_solar_production
              - sensor.flexio_battery_power
            hours_to_show: 6
            title: Vermogen
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.flexio_inverter_power
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            content: |-
              ### Waarom er hier twee staan

              **Omvormer, totaal AC** is alles wat de omvormer verplaatst, met de zonneproductie er al in. **Batterij** is de stroom van de batterij zelf, `omvormer − zon`, en dat is het getal dat de FlexiO-app toont en waarop de energietellers gebouwd zijn.

              Op een zonnige namiddag staat de omvormer flink positief terwijl de batterij bijna op nul zit. De omvormer voor de batterij aanzien is precies wat een batterij vele malen meer energie laat leveren dan ze ooit heeft opgenomen.
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Prijs en de generieke last
            heading_style: title
            icon: mdi:currency-eur
          - type: tile
            entity: sensor.flexio_electricity_price
            name: Elektriciteitsprijs
            color: green
            features:
              - type: trend-graph
            features_position: bottom
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.flexio_electricity_price
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_generic_load_available_power
            name: Generieke last beschikbaar
            color: teal
            vertical: true
            grid_options:
              columns: 6
              rows: 2
            visibility:
              - condition: state
                entity: sensor.flexio_generic_load_available_power
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: number.flexio_generic_load_maximum_price
            name: Prijsplafond generieke last
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: number.flexio_generic_load_maximum_price
                state_not:
                  - unavailable
                  - unknown
          - type: history-graph
            entities:
              - sensor.flexio_electricity_price
            hours_to_show: 24
            title: Elektriciteitsprijs
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.flexio_electricity_price
                state_not:
                  - unavailable
                  - unknown
          - type: heading
            heading: Diagnostiek
            heading_style: title
            icon: mdi:information-outline
          - type: tile
            entity: sensor.flexio_converter
            name: Omvormer
            color: grey
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.flexio_converter
                state_not:
                  - unavailable
                  - unknown
          - type: tile
            entity: sensor.flexio_last_measurement
            name: Laatste meting
            color: grey
            vertical: false
            grid_options:
              columns: 12
              rows: 1
            visibility:
              - condition: state
                entity: sensor.flexio_last_measurement
                state_not:
                  - unavailable
                  - unknown
          - type: markdown
            content: Kaarten voor een meting die jouw firmware niet doorgeeft staan op niet beschikbaar. Het setpoint van de omvormer, de generieke last en de elektriciteitsprijs zijn de gebruikelijke; de laatste meting staat standaard uit en kun je op de apparaatpagina aanzetten.
            grid_options:
              columns: full
