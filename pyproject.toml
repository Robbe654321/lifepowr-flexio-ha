[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ANN", "ASYNC", "B", "C4", "D", "E", "F", "I", "ICN", "INP", "ISC",
  "N", "PGH", "PIE", "PL", "PT", "RET", "RSE", "RUF", "SIM", "SLOT", "T20",
  "TID", "TRY", "UP", "W",
]
ignore = [
  "ANN401",
  "D203",
  "D213",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "PLR2004"]
# The scripts are standalone developer tools, not part of the integration.
# Printing is how they report, their thresholds read better inline than as
# named constants, and check_box's report is one deliberately linear pass.
"scripts/*" = ["T201", "PLR2004", "PLR0912", "PLR0915"]
# Published solar algorithms: their coefficients are the citation, and naming
# each one individually would obscure rather than explain the formula. The
# transposition and fitting entry points genuinely take a physical model's
# worth of arguments.
"custom_components/lifepowr/solar.py" = ["PLR0913", "PLR2004"]
"custom_components/lifepowr/learning.py" = ["PLR0912", "PLR0913"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
