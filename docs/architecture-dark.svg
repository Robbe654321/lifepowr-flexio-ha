<svg xmlns="http://www.w3.org/2000/svg" width="940" height="588" viewBox="0 0 940 588" role="img" aria-label="Data flow from the FlexiObox through the integration into Home Assistant">
<rect width="940" height="588" fill="#0d1117"/>
<text x="24" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#e6edf3">How it fits together</text>
<text x="24" y="64" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9198a1">The box stays on your network. No account, no authentication. Only the optional solar forecast reaches out, for the weather.</text>
<rect x="24" y="92" width="244" height="344" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="42" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">FlexiObox</text>
<text x="42" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">myio.local · local network only</text>
<line x1="42" y1="158" x2="250" y2="158" stroke="#3d444d"/>
<text x="42" y="182" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#79c0ff">GET  /api/ems/measurements</text>
<text x="42" y="202" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#79c0ff">GET  /api/ems/generic-load</text>
<text x="42" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#79c0ff">GET  /api/info/version</text>
<text x="42" y="242" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#79c0ff">GET  /api/info/converter</text>
<text x="42" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#d29922">POST /api/ems/generic-load</text>
<text x="42" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">the only writable value</text>
<rect x="348" y="92" width="244" height="344" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="366" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">lifepowr</text>
<text x="366" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">the integration</text>
<line x1="366" y1="158" x2="574" y2="158" stroke="#3d444d"/>
<text x="366" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">Probes the layout once,</text>
<text x="366" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">falls back to older paths</text>
<text x="366" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">Maps 12 fields by alias,</text>
<text x="366" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">spelling-insensitive</text>
<text x="366" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3fb950">Reports watts, not kW</text>
<text x="366" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3fb950">Flips grid + load sign</text>
<text x="366" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3fb950">Derives battery = inv − PV</text>
<text x="366" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">polls every 10 s, tunable</text>
<text x="366" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">Learns the roof overnight</text>
<text x="366" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">from recorder statistics</text>
<text x="366" y="422" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">tilt · bearing · kW · skyline</text>
<rect x="672" y="92" width="244" height="344" rx="10" fill="#161b22" stroke="#3d444d"/>
<text x="690" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Home Assistant</text>
<text x="690" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">one device, real entities</text>
<line x1="690" y1="158" x2="898" y2="158" stroke="#3d444d"/>
<text x="690" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">13 sensors</text>
<text x="690" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">solar · load · grid · battery</text>
<text x="690" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">inverter · price · SoC · SoH</text>
<text x="690" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">battery V · A</text>
<text x="690" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">6 kWh totals</text>
<text x="690" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">integrated from the watts</text>
<text x="690" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e6edf3">1 number</text>
<text x="690" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">generic load price cap</text>
<text x="690" y="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3fb950">6 solar forecasts</text>
<text x="690" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">optional; the roof, learned</text>
<text x="690" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#9198a1">from its own history</text>
<path d="M276 264.0 H332" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M600 264.0 H656" stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M794 430 V458 H146 V442" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#w)"/>
<text x="470.0" y="476" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#d29922">setting the price cap posts straight back to the box</text>
<rect x="24" y="498" width="892" height="66" rx="10" fill="#161b22" stroke="#3d444d" stroke-dasharray="5 4"/>
<text x="44" y="525" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">Built in: <tspan font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#79c0ff">device_class: energy</tspan> totals for the Energy dashboard</text>
<text x="44" y="546" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9198a1">Grid and battery are split into directions and the watts integrated into kWh — six totals the Energy dashboard lists directly, no YAML.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
</svg>