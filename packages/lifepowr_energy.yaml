# LIFEPOWR FlexiO — Energy dashboard package
#
# The FlexiObox only reports live power (kW). The Energy dashboard needs
# cumulative energy (kWh), so this package:
#   1. splits the bidirectional grid and battery power into separate
#      positive-only directions, and
#   2. integrates each of them into a kWh total_increasing sensor.
#
# Install: copy this file to config/packages/lifepowr_energy.yaml and add
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# to configuration.yaml, then restart Home Assistant.
#
# ---------------------------------------------------------------------------
# SIGN CONVENTION — verify this once before trusting the totals.
# This package assumes:
#   sensor.flexio_grid_power     > 0 = importing from the grid, < 0 = exporting
#   sensor.flexio_inverter_power > 0 = battery discharging, < 0 = charging
# Watch both sensors for a few minutes on a sunny moment. If the signs are
# reversed on your box, swap the `max` and `min` expressions in the two pairs
# of template sensors below — nothing else needs to change.
# ---------------------------------------------------------------------------

template:
  - sensor:
      - name: "FlexiO grid import power"
        unique_id: flexio_grid_import_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.flexio_grid_power')
             not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ [states('sensor.flexio_grid_power') | float(0), 0] | max | round(3) }}

      - name: "FlexiO grid export power"
        unique_id: flexio_grid_export_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.flexio_grid_power')
             not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ ([states('sensor.flexio_grid_power') | float(0), 0] | min) | abs | round(3) }}

      - name: "FlexiO battery discharge power"
        unique_id: flexio_battery_discharge_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.flexio_inverter_power')
             not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ [states('sensor.flexio_inverter_power') | float(0), 0] | max | round(3) }}

      - name: "FlexiO battery charge power"
        unique_id: flexio_battery_charge_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.flexio_inverter_power')
             not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {{ ([states('sensor.flexio_inverter_power') | float(0), 0] | min) | abs | round(3) }}

# Trapezoidal integration of kW over hours gives kWh directly, so no
# unit_prefix is needed. max_sub_interval keeps the totals moving even when a
# power value sits perfectly still between updates.
sensor:
  - platform: integration
    name: "FlexiO solar production energy"
    unique_id: flexio_solar_production_energy
    source: sensor.flexio_solar_production
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    name: "FlexiO household consumption energy"
    unique_id: flexio_household_consumption_energy
    source: sensor.flexio_household_consumption
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    name: "FlexiO grid import energy"
    unique_id: flexio_grid_import_energy
    source: sensor.flexio_grid_import_power
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    name: "FlexiO grid export energy"
    unique_id: flexio_grid_export_energy
    source: sensor.flexio_grid_export_power
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    name: "FlexiO battery charge energy"
    unique_id: flexio_battery_charge_energy
    source: sensor.flexio_battery_charge_power
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

  - platform: integration
    name: "FlexiO battery discharge energy"
    unique_id: flexio_battery_discharge_energy
    source: sensor.flexio_battery_discharge_power
    method: trapezoidal
    unit_time: h
    round: 3
    max_sub_interval:
      minutes: 1

# ---------------------------------------------------------------------------
# Energy dashboard mapping (Settings > Dashboards > Energy):
#
#   Grid consumption      -> sensor.flexio_grid_import_energy
#   Return to grid        -> sensor.flexio_grid_export_energy
#   Solar production      -> sensor.flexio_solar_production_energy
#   Battery: energy in    -> sensor.flexio_battery_charge_energy
#   Battery: energy out   -> sensor.flexio_battery_discharge_energy
#
# Add sensor.flexio_electricity_price as the "Use an entity with current price"
# option on the grid consumption source to get live cost tracking.
# ---------------------------------------------------------------------------
